name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run tests
        run: python -m unittest discover -s tests -v

  # Optional mutmut job - enable by changing `if: false` to a condition or removing it
  mutmut:
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install mutmut
        run: |
          python -m pip install --upgrade pip
          pip install mutmut
      - name: Run mutmut (may be slow)
        run: |
          mutmut run --paths main.py
          mutmut results
