<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" style="max-width:100%; height:auto; overflow:visible;">
  <style>
    .box { fill: #f8f9fa; stroke: #2d3748; stroke-width: 1.6; rx: 8; ry: 8; }
    .cause { fill: #fff7e6; stroke: #b7791f; stroke-width: 1.6; rx: 8; ry: 8; }
    .effect { fill: #e6fffa; stroke: #0f766e; stroke-width: 1.6; rx: 8; ry: 8; }
    .logic { fill: #edf2f7; stroke: #4a5568; stroke-width: 1.2; stroke-dasharray: 5 4; rx: 8; ry: 8; }
    .text { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #1a202c; }
    .small { font-size: 11px; fill: #4a5568; }
    .title { font-size: 16px; font-weight: bold; }
  </style>

  <text x="30" y="28" class="text title">Cause-Effect Graph pentru evaluate_application</text>
  <text x="30" y="48" class="text small">Cauze: condiții de intrare; efecte: decizia finală. Nodurile sunt mapate la teste din suita existentă.</text>

  <!-- Causes -->
  <rect x="30" y="80" width="250" height="75" class="cause"/>
  <text x="46" y="104" class="text">C1: credit_score &lt; 550</text>
  <text x="46" y="124" class="text">C2: credit_score &gt;= 700</text>
  <text x="46" y="144" class="text">C3: has_cosigner = true</text>

  <rect x="30" y="175" width="250" height="95" class="cause"/>
  <text x="46" y="200" class="text">C4: monthly_income &gt;= 5000</text>
  <text x="46" y="220" class="text">C5: monthly_income &gt;= 3000</text>
  <text x="46" y="240" class="text">C6: debt_ratio &lt;= 0.4 / 0.5</text>

  <rect x="30" y="290" width="250" height="75" class="cause"/>
  <text x="46" y="315" class="text">C7: credit_score / income / debt</text>
  <text x="46" y="335" class="text">non-negative</text>
  <text x="46" y="355" class="text">C8: amount / months in interval</text>

  <!-- Logic / rules -->
  <rect x="345" y="95" width="250" height="70" class="logic"/>
  <text x="362" y="120" class="text">R1: C1 -&gt; E1 (Reject)</text>
  <text x="362" y="140" class="text">if any input is negative -&gt; ValueError</text>

  <rect x="345" y="185" width="250" height="85" class="logic"/>
  <text x="362" y="210" class="text">R2: C4 ∧ C6 ∧ (C2 ∨ C3) -&gt; E1 (Approved)</text>
  <text x="362" y="230" class="text">R3: C4 ∧ C6 ∧ ¬(C2 ∨ C3) -&gt; E1 (Manual review)</text>
  <text x="362" y="250" class="text">R4: C5 ∧ C6 ∧ C3 -&gt; E1 (Manual review)</text>

  <rect x="345" y="295" width="250" height="70" class="logic"/>
  <text x="362" y="320" class="text">R5: ¬(R1..R4) -&gt; E1 (Rejected)</text>
  <text x="362" y="340" class="text">E2: calculate_interest_rate uses C8</text>

  <!-- Effects -->
  <rect x="685" y="115" width="250" height="70" class="effect"/>
  <text x="702" y="140" class="text">E1: Decision outcome</text>
  <text x="702" y="160" class="text">approved / manual_review / rejected</text>

  <rect x="685" y="245" width="250" height="70" class="effect"/>
  <text x="702" y="270" class="text">E2: Interest rate adjusted</text>
  <text x="702" y="290" class="text">by amount / months / salary account</text>

  <rect x="685" y="375" width="250" height="70" class="effect"/>
  <text x="702" y="400" class="text">E3: Validation error</text>
  <text x="702" y="420" class="text">for invalid bounds / negative values</text>

  <!-- Arrows -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2d3748" />
    </marker>
  </defs>

  <line x1="280" y1="118" x2="345" y2="129" stroke="#2d3748" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="280" y1="222" x2="345" y2="225" stroke="#2d3748" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="280" y1="328" x2="345" y2="330" stroke="#2d3748" stroke-width="1.2" marker-end="url(#arrow)"/>

  <line x1="595" y1="130" x2="685" y2="150" stroke="#2d3748" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="595" y1="230" x2="685" y2="270" stroke="#2d3748" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="595" y1="330" x2="685" y2="410" stroke="#2d3748" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Mapping notes -->
  <text x="30" y="500" class="text small">Mapping către teste: C1/C2/C3 → testele din test_loan_evaluator_core.py și test_loan_evaluator_ai_generated.py;</text>
  <text x="30" y="518" class="text small">C4/C5/C6 → testele de graniță și mutmut; C8 → testele pentru calculate_interest_rate.</text>
</svg>
