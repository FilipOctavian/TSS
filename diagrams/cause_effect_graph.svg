<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <style> .box{fill:#f8f9fa;stroke:#2d3748;stroke-width:1.5} .text{font-family:Arial,Helvetica,sans-serif;font-size:13px}</style>
  <!-- Causes -->
  <rect x="20" y="20" width="200" height="60" class="box"/>
  <text x="30" y="45" class="text">C1: credit_score (numeric)</text>
  <text x="30" y="60" class="text">C2: monthly_income</text>

  <rect x="20" y="100" width="200" height="80" class="box"/>
  <text x="30" y="125" class="text">C3: existing_debt</text>
  <text x="30" y="140" class="text">C4: has_cosigner (bool)</text>

  <rect x="20" y="200" width="200" height="60" class="box"/>
  <text x="30" y="235" class="text">C5: loan_amount, months</text>

  <!-- Effects -->
  <rect x="520" y="40" width="240" height="60" class="box"/>
  <text x="540" y="75" class="text">E1: Decision = Approve / Manual review / Reject</text>

  <rect x="520" y="140" width="240" height="60" class="box"/>
  <text x="540" y="175" class="text">E2: Interest rate (numeric)</text>

  <!-- Arrows -->
  <line x1="220" y1="50" x2="520" y2="70" stroke="#2d3748" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="220" y1="140" x2="520" y2="160" stroke="#2d3748" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="220" y1="220" x2="520" y2="190" stroke="#2d3748" stroke-width="1.2" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2d3748" />
    </marker>
  </defs>

  <!-- Mapping labels -->
  <text x="260" y="40" class="text">tests → conditions: credit_score thresholds</text>
  <text x="260" y="160" class="text">tests → conditions: debt ratio, income bands</text>
  <text x="260" y="220" class="text">tests → conditions: amount/month boundaries</text>
</svg>
